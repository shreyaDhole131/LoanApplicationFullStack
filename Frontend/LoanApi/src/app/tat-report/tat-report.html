<div class="container mt-4">

  <h3 class="mb-3">Turn Around Time (TAT) Report</h3>

  <div class="row g-3 align-items-end mb-3">

    <div class="col-md-3">
      <label class="form-label">From Date</label>
      <input type="date" class="form-control" [(ngModel)]="fromDate" name="fromDate" (ngModelChange)="applyfilters()">
    </div>

    <div class="col-md-3">
      <label class="form-label">To Date</label>
      <input type="date" class="form-control" [(ngModel)]="toDate" name="toDate" (ngModelChange)="applyfilters()">
    </div>

    <div class="col-md-2">
      <button class="btn btn-primary w-100" (click)="applyfilters()">Search</button>
    </div>

    <div class="col-md-2">
      <button class="btn btn-outline-secondary w-100" (click)="resetFilters()">Reset</button>
    </div>

  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th scope="col">Stage</th>
          <th scope="col">Average Days</th>
          <th scope="col">Minimum Days</th>
          <th scope="col">Maximum Days</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of tatReport">
          <td>{{ e.stage }}</td>
          <td>{{ e.avgDays }}</td>
          <td>{{ e.minDays }}</td>
          <td>{{ e.maxDays }}</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
