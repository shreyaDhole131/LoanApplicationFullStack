<div class="customers-layout">

  <app-officer-sidebar></app-officer-sidebar>

  <div class="customers-main">



    <div class="container mt-4">

      <h3 class="mb-3">Disbursement Report</h3>

      <div class="row g-3 align-items-end mb-3">

        <div class="col-md-3">
          <label class="form-label">From Date</label>
          <input type="date" class="form-control" [(ngModel)]="fromDate" name="fromDate"
            (ngModelChange)="applyfilters()">
        </div>

        <div class="col-md-3">
          <label class="form-label">To Date</label>
          <input type="date" class="form-control" [(ngModel)]="toDate" name="toDate" (ngModelChange)="applyfilters()">
        </div>

        <div class="col-md-2">
          <button class="btn btn-primary w-100" (click)="applyfilters()">Search</button>
        </div>

        <div class="col-md-2">
          <button class="btn btn-outline-secondary w-100" (click)="resetFilters()">Reset</button>
        </div>

      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">Month</th>
              <th scope="col">Loans Disbursed</th>
              <th scope="col">Disbursement Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let e of disburseReport">
              <td>{{ e.month }}</td>
              <td>{{ e.loanDisbursed }}</td>
              <td>{{ e.decimalAmount }}</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>
</div>
