<p>emi-report works!</p>


<div class="col-md-2">
  <input type="date" class="form-control" [(ngModel)]="fromDate" name="fromDate" (ngModelChange)="applyfilters()">
</div>

<div class="col-md-2">
  <input type="date" class="form-control" [(ngModel)]="toDate" name="toDate" (ngModelChange)="applyfilters()">
</div>

<div class="col-md-1 d-flex align-items-end">
  <button class="btn btn-primary w-100" (click)="applyfilters()">Search</button>
</div>


<div class="mt-3">
  <button class="btn btn-outline-secondary btn-sm" (click)="resetFilters()">Reset</button>
</div>


<div class="table-responsive">
  <table class="table table-bordered align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th scope="col">Particulars</th>
        <th scope="col">Count</th>
        <th scope="col">Amount</th>
        <th scope="col">%</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of emiReport">
        <td>{{ e.particulars }}</td>
        <td>{{ e.count }}</td>
        <td>{{ e.amount }}</td>
        <td>{{ e.percent }}</td>

      </tr>
    </tbody>
  </table>
</div>
