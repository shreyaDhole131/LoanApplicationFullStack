<p>cibil-report works!</p>

<div class="col-md-2">
  <input type="date" class="form-control" [(ngModel)]="fromDate" name="fromDate" (ngModelChange)="applyfilters()">
</div>

<div class="col-md-2">
  <input type="date" class="form-control" [(ngModel)]="toDate" name="toDate" (ngModelChange)="applyfilters()">
</div>

<div class="col-md-1 d-flex align-items-end">
  <button class="btn btn-primary w-100" (click)="applyfilters()">Search</button>
</div>


<div class="mt-3">
  <button class="btn btn-outline-secondary btn-sm" (click)="resetFilters()">Reset</button>
</div>

<div class="table-responsive">
  <table class="table table-bordered align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th scope="col">Cibil Score Range</th>
        <th scope="col">Applicants</th>
        <th scope="col">Approved</th>
        <th scope="col">Approval %</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of cibilReport">
        <td>{{ e.cibilScoreRange }}</td>
        <td>{{ e.applicants }}</td>
        <td>{{ e.approved }}</td>
        <td>{{ e.approval }}</td>

      </tr>
    </tbody>
  </table>
</div>
